name: Update podcast feed

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest official episodes
        run: |
          mkdir -p data
          curl --fail --location --retry 3 'https://feeds.megaphone.fm/pitchforkeconomics' -o /tmp/podcast.xml
          python3 - <<'PY'
          import datetime, email.utils, html, json, re, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/podcast.xml').find('channel')
          episodes = []
          for item in root.findall('item')[:6]:
              title = item.findtext('title') or ''
              published = email.utils.parsedate_to_datetime(item.findtext('pubDate')).astimezone(datetime.timezone.utc)
              enclosure = item.find('enclosure')
              slug = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')
              episodes.append({
                  'id': item.findtext('guid'),
                  'date': published.strftime('%Y-%m-%dT%H:%M:%S'),
                  'slug': slug,
                  'link': 'https://podcasts.apple.com/us/podcast/pitchfork-economics-with-nick-hanauer/id1445901378',
                  'audio': enclosure.get('url') if enclosure is not None else '',
                  'title': title,
                  'excerpt': html.unescape(item.findtext('description') or ''),
              })
          with open('data/podcast-episodes.json', 'w', encoding='utf-8') as output:
              json.dump({'source': 'https://feeds.megaphone.fm/pitchforkeconomics', 'updatedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'episodes': episodes}, output, ensure_ascii=False, indent=2)
              output.write('\n')
          PY
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/podcast-episodes.json
          git diff --cached --quiet || git commit -m "chore: refresh podcast episodes"
          git push
