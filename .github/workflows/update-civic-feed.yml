name: Update Civic Ventures feed

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest newsletter posts
        run: python scripts/update-civic-feed.py
      - name: Commit updates
        run: |
          if git diff --quiet -- data/civic-feed.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/civic-feed.json
          git commit -m "Update Civic Ventures newsletter feed"
          git push
